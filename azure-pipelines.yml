trigger:
  branches:
    include:
      - master


pool: default

stages:
- stage: stageinfrapipeline
  displayName: vineet rg pipe line
  jobs:
  - job: terraforminstall 
    displayName: infrainit job 
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
        task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendserviceArm: 'azuresc'
          backendazurmResourceGroupName: 'vineetyadav-rg'
          backendAzureRmKey: 'ram.terraform.tfstate'
    -
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'azuresc'
   - task: TerraformTask@5
     inputs:
       provider: 'azurerm'
       command: 'apply'
       commandOptions: '-auto-approve'
       environmentServiceNameNameAzureRm: 'azuresc'